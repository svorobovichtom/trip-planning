# /etc/systemd/system/caddy.service.d/20-sites.conf
# Run Caddy from root.caddy so apps can live in /etc/caddy/sites.d/ without
# editing /etc/caddy/Caddyfile (Flatsy's bootstrap.sh owns and rewrites it).
[Service]
ExecStart=
ExecStart=/usr/bin/caddy run --environ --adapter caddyfile --config /etc/caddy/root.caddy
ExecReload=
ExecReload=/usr/bin/caddy reload --adapter caddyfile --config /etc/caddy/root.caddy --force
